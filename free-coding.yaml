runtime:
  language: go
statement: |
  In the `main` function, write the Go code to interact with the `BankAccount` struct:
  1. Instantiate a new `BankAccount` pointer named `account` for owner `"Bob"` with an initial balance of `200` using `NewBankAccount`.
  2. Call `Deposit` with an amount of `100`.
  3. Call `Withdraw` with an amount of `50`.
  4. Print the final balance using `fmt.Printf("Balance: %d\n", account.balance)`.
executions:
  - title: Standard Transaction Sequence
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: locked
    location:
      snippet: |-
        package main

        import "fmt"

        type BankAccount struct {
            owner   string
            balance int
        }

        func NewBankAccount(owner string, balance int) *BankAccount {
            return &BankAccount{
                owner:   owner,
                balance: balance,
            }
        }

        func (a *BankAccount) Deposit(amount int) int {
            if amount > 0 {
                a.balance += amount
                fmt.Printf("Deposited %d\n", amount)
            }
            return a.balance
        }

        func (a *BankAccount) Withdraw(amount int) int {
            if 0 < amount && amount <= a.balance {
                a.balance -= amount
                fmt.Printf("Withdrew %d\n", amount)
            } else {
                fmt.Println("Insufficient funds")
            }
            return a.balance
        }
  - type: editable
    location:
      snippet: |2-
            account := NewBankAccount("Bob", 200)
            account.Deposit(100)
            account.Withdraw(50)
            fmt.Printf("Balance: %d\n", account.balance)
    placeholder: |-
      // 1. Create a BankAccount for "Bob" with 200 initial balance
      // 2. Deposit 100
      // 3. Withdraw 50
      // 4. Output formatted balance
