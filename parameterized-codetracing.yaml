$schema: https://learning-contents.org/schemas/parameterized-code-tracing/0.1.0
license: MIT
locale: en-US
id: parameterized_code_tracing_bank_account
source: main.go
title: Trace Go Bank Account State Transitions
description: Trace the sequence of balance updates and console outputs as starting balance, deposit amounts, and withdrawal amounts vary.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parameterized-code-tracing
  difficulty: novice
  prereq_topics:
    - basic-syntax
    - variables
  topics:
    - structs
    - pointers
    - methods
    - constructors
    - conditional-logic
    - state-tracing
    - arithmetic
runtime:
  language: go
statement: |
  Trace the execution of the Go program below and determine the exact console output produced.
  Pay close attention to:
  * How the initial balance is modified after `Deposit(...)`.
  * Whether the withdrawal amount exceeds the balance after deposit, triggering the `"Insufficient funds"` branch.
  * The final balance value output by `fmt.Printf("Balance: %d\n", account.balance)`.
elements:
  - type: parameter
    location:
      context: account := NewBankAccount("Bob", 200)
      snippet: '200'
    values:
      - 100
      - 200
      - 300
  - type: parameter
    location:
      context: account.Deposit(100)
      snippet: '100'
    values:
      - 50
      - 100
      - 150
  - type: parameter
    location:
      context: account.Withdraw(50)
      snippet: '50'
    values:
      - 50
      - 200
      - 350
