id: we_bank_account
title: Bank Account Management
description: Learn how to use structs and methods to manage a bank account in Go.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics: []
  topics:
    - structs
    - state
runtime:
  language: go
statement: |
  This worked example demonstrates how `BankAccount` state is managed in Go using structs and receiver methods. We'll examine:
  1. Struct constructor (`NewBankAccount`)
  2. Deposit method (`Deposit`)
  3. Withdrawal method (`Withdraw`)
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    console: |-
      Deposited 100
      Withdrew 50
      Balance: 250
    status: pass
elements:
  - type: explanation
    location:
      snippet: "func NewBankAccount(owner string, balance int) *BankAccount {"
    explanations:
      - body: |
          In Go, constructors are standard factory functions returning pointer to struct:
          ```go
          func NewBankAccount(owner string, balance int) *BankAccount {
              return &BankAccount{
                  owner:   owner,
                  balance: balance,
              }
          }
          ```
          This instantiates and returns a pointer to a `BankAccount`.
  - type: explanation
    location:
      snippet: "if 0 < amount && amount <= a.balance {"
    explanations:
      - body: |
          This condition validates that the withdrawal transaction is correct: it checks if the `amount` is greater than `0` and is less than or equal to the current `a.balance`.
