id: mcq_bank_account_deposit
title: Go Struct Deposit Method Implementation
description: Choose the correct implementation of the Deposit method on a Go BankAccount pointer receiver.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: multiple-choice-question
  difficulty: intermediate
  prereq_topics:
    - basic-syntax
