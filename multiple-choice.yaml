include_choices: 4
question: |
  Given the following Go struct definition:
  
  ```go
  type BankAccount struct {
      owner   string
      balance int
  }
  ```
  
  Which of the following represents the correct implementation for a `Deposit` method in Go that validates positive deposit amounts, modifies the original `BankAccount` instance, and returns the new balance?
choices:
  - body: |
      ```go
      func (a *BankAccount) Deposit(amount int) int {
          if amount > 0 {
              a.balance += amount
          }
          return a.balance
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! In Go, mutating struct fields requires a **pointer receiver** `(a *BankAccount)`. This method validates that `amount > 0`, updates `a.balance` in place, and returns the updated balance.
  - body: |
      ```go
      func (a BankAccount) Deposit(amount int) int {
          if amount > 0 {
              a.balance += amount
          }
          return a.balance
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. In Go, a **value receiver** `(a BankAccount)` operates on a shallow copy of the struct. Modifications to `a.balance` are discarded as soon as the method returns.
  - body: |
      ```go
      func (a *BankAccount) Deposit(amount int) int {
          if amount > 0 {
              a.balance =+ amount
          }
          return a.balance
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. In Go, `=+` is parsed as an assignment of positive `amount` (`a.balance = +amount`), which overwrites the existing balance rather than accumulating funds with `+=`.
  - body: |
      ```go
      func Deposit(a *BankAccount, amount int) int {
          if amount > 0 {
              a.balance += amount
          }
          return a.balance
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. This defines a standalone package function `Deposit(a, amount)` rather than a method bound to the `*BankAccount` type. It cannot be invoked using method syntax `account.Deposit(100)`.
